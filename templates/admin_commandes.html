{% extends "base.html" %}
{% block title %}Gestion des commandes{% endblock %}
{% block content %}
<div class="page-section">
    <h1 class="section-title">Gestion des commandes</h1>
    <p style="text-align:center;"><a href="/dashboard" style="color:#c9a227;">← Retour au tableau de bord</a></p>

    <div class="dashboard-table-block" style="max-width: 800px; margin: 0 auto;">
        <table class="admin-table">
            <tr><th>N°</th><th>Date</th><th>Total</th><th>Statut</th></tr>
            {% for c in commandes %}
            <tr>
                <td>{{ c.id }}</td>
                <td>{{ c.date }}</td>
                <td>{{ c.total }} Dhs</td>
                <td>
                    <form method="POST" action="/admin/commandes/statut/{{ c.id }}" style="display:flex; gap:5px;">
                        <select name="statut">
                            <option value="en attente" {% if c.statut == 'en attente' %}selected{% endif %}>En attente</option>
                            <option value="en préparation" {% if c.statut == 'en préparation' %}selected{% endif %}>En préparation</option>
                            <option value="terminée" {% if c.statut == 'terminée' %}selected{% endif %}>Terminée</option>
                        </select>
                        <button type="submit" class="btn-gold" style="padding:4px 12px; font-size:0.8rem;">Mettre à jour</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
