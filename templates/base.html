<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}bewok{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center" href="/">
    <img src="{{ url_for('static', filename='images/sushi.png') }}" alt="Logo" height="40" class="me-2">
    <span data-fr="Bewok" data-en="Bewok" data-es="Bewok">bewok</span>
<div class="navbar-nav d-flex flex-row">
    <a class="nav-link me-3" href="/" data-fr="Accueil" data-en="Home" data-es="Inicio">Accueil</a>
    <a class="nav-link me-3" href="/menu" data-fr="Menu" data-en="Menu" data-es="Menú">Menu</a>
    <a class="nav-link me-3" href="/reservation" data-fr="Réservation" data-en="Reservation" data-es="Reserva">Réservation</a>
    <a class="nav-link me-3" href="/contact" data-fr="Contact" data-en="Contact" data-es="Contacto">Contact</a>
    <button id="lang" class="btn btn-sm btn-outline-light">FR</button>
</div>
    </div>
</nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <footer class="bg-dark text-white mt-5 py-5">
    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-3">
                <h5 style="color: #c9a227;" data-fr="Mon Restaurant" data-en="My Restaurant" data-es="Mi Restaurante">bewok</h5>
                <p data-fr="Une expérience culinaire raffinée, entre tradition et modernité."
                   data-en="A refined culinary experience, between tradition and modernity."
                   data-es="Una experiencia culinaria refinada, entre tradición y modernidad.">
                   Une expérience culinaire raffinée, entre tradition et modernité.
                </p>
            </div>
            <div class="col-md-4 mb-3">
               <h5 style="color: #c9a227;" data-fr="Bewok" data-en="Bewok" data-es="Bewok">Adresse</h5>
                <p data-fr="Casablanca, Maroc<br>+212 6 00 00 00 00<br>contact@monrestaurant.ma"
                   data-en="Casablanca, Morocco<br>+212 6 00 00 00 00<br>contact@monrestaurant.ma"
                   data-es="Casablanca, Marruecos<br>+212 6 00 00 00 00<br>contact@monrestaurant.ma">
                   Casablanca, Maroc<br>+212 6 00 00 00 00<br>contact@monrestaurant.ma
                </p>
            </div>
            <div class="col-md-4 mb-3">
                <h5 style="color: #c9a227;" data-fr="Horaires" data-en="Opening Hours" data-es="Horario">Horaires</h5>
                <p data-fr="Lundi - Dimanche<br>12h00 - 23h00"
                   data-en="Monday - Sunday<br>12:00 PM - 11:00 PM"
                   data-es="Lunes - Domingo<br>12:00 - 23:00">
                   Lundi - Dimanche<br>12h00 - 23h00
                </p>
            </div>
        </div>
        <hr style="border-color: #555;">
        <p class="text-center mb-0" data-fr="© 2026 Bewok. Tous droits réservés." data-en="© 2026 Bewok. All rights reserved." data-es="© 2026 Bewok. Todos los derechos reservados.">© 2026 Bewok. Tous droits réservés.</p>
    </div>
</footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
